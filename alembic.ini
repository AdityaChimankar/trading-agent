# Alembic Configuration
[alembic]
script_location = migrations
version_path_separator = os
file_template = %%Y%%m%%d_%%H%%M%%S_%%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///data/trading.db

[post_write_hooks]
hooks = format
format.type = console_scripts
format.entrypoint = ruff format
format.options = revisions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S