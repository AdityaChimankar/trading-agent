x-app: &app
  image: trading-agent-app:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    ENVIRONMENT: production
    API_HOST: 0.0.0.0
    API_WORKERS: "1"
    KITE_LOGIN_HEADLESS: "true"
    DB_URL: sqlite:////app/data/trading.db
    DATA_DIR: /app/data
    # Override the local .env log path with a writable, persistent container path.
    LOG_FILE: /app/data/logs/trading-agent.log
    CACHE_DIR: /app/data/cache
    STORAGE_PARQUET_ROOT: /app/data/parquet
    ML_MODEL_DIR: /app/models
    # Read by the API only: arm research automation over live_symbols.txt at startup,
    # so the dashboard's 1-minute plans are rescanned as each bar closes.
    API_RESEARCH_AUTOSTART: live
  volumes:
    - ./data:/app/data
    - ./models:/app/models

services:
  api:
    <<: *app
    command: trading-agent-api
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: trading-agent-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *app
    command: trading-agent-scheduler
    profiles: ["live"]
    restart: unless-stopped

  ticker:
    <<: *app
    command: trading-agent-ticker
    profiles: ["live"]
    restart: unless-stopped

  tools:
    <<: *app
    command: trading-agent --help
    profiles: ["tools"]

networks:
  default:
    name: trading-agent-network
