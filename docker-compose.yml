x-app: &app
  image: trading-agent-app:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    ENVIRONMENT: production
    KITE_LOGIN_HEADLESS: "true"
    DB_URL: sqlite:////app/data/trading.db
    DATA_DIR: /app/data
    CACHE_DIR: /app/data/cache
    STORAGE_PARQUET_ROOT: /app/data/parquet
    ML_MODEL_DIR: /app/models
  volumes:
    - ./data:/app/data
    - ./models:/app/models

services:
  api:
    <<: *app
    command: trading-agent-api
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *app
    command: trading-agent-scheduler
    profiles: ["live"]
    restart: unless-stopped

  ticker:
    <<: *app
    command: trading-agent-ticker
    profiles: ["live"]
    restart: unless-stopped

  tools:
    <<: *app
    command: trading-agent --help
    profiles: ["tools"]

volumes:
  frontend_node_modules:

networks:
  default:
    name: trading-agent-network
