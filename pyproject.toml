[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "2.0.0"
description = "NSE Intraday Trading Signal Agent - Local-first research pipeline with rule-based, LLM, and ML decision paths"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Trading Agent Team", email = "team@trading-agent.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # Core data & compute
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.3",
    # Database & storage
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "duckdb>=0.9",
    "pyarrow>=14.0",
    # API & web
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    # Kite Connect
    "kiteconnect>=4.2",
    "pyotp>=2.9",
    "playwright>=1.40",
    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.9",
    "httpx>=0.25",
    "tenacity>=8.2",
    "structlog>=24.1",
    # Scheduling
    "apscheduler>=3.10",
    # Email/alerts
    "aiofiles>=23.2",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "ruff>=0.1.0",
    "black>=23.12",
    "mypy>=1.7",
    "pre-commit>=3.6",
    "ipython>=8.18",
    "jupyter>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
]
viz = [
    "plotly>=5.18",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
ml = [
    "optuna>=3.4",
    "shap>=0.43",
]

[project.scripts]
trading-agent = "trading_agent.cli:app"
trading-agent-api = "trading_agent.api.main:run"
trading-agent-ingest = "trading_agent.ingest.cli:app"
trading-agent-research = "trading_agent.research.cli:app"
trading-agent-optimize = "trading_agent.optimize.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_agent*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args
    "C901",  # too complex (allow for research code)
    "S101",  # assert (used in tests)
    "T201",  # print (allowed in CLI/scripts)
]

exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
    "frontend/node_modules",
    "dist",
    "build",
    "*.egg-info",
    "data/parquet",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "T201", "PLR2004"]
"scripts/**/*.py" = ["T201"]
"research/**/*.py" = ["C901", "PLR0915", "PLR0912"]

[tool.ruff.lint.isort]
known-first-party = ["trading_agent"]

[tool.black]
target-version = ["py311"]
line-length = 100
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | venv
  | node_modules
  | frontend/node_modules
  | dist
  | build
  | \.egg-info
  | data/parquet
  | \.pytest_cache
  | \.mypy_cache
  | \.ruff_cache
)/
'''

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
files = ["src/trading_agent"]
exclude = [
    "tests",
    "scripts",
    "research",
    "frontend",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=trading_agent",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=60",
]
markers = [
    "unit: Fast unit tests",
    "integration: Integration tests requiring DB/API",
    "slow: Tests taking >10s",
    "ml: ML model tests",
    "api: API endpoint tests",
]

[tool.coverage.run]
source = ["src/trading_agent"]
omit = [
    "*/tests/*",
    "*/scripts/*",
    "*/research/*",
    "*/__pycache__/*",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pydocstyle]
convention = "numpy"
match_dir = "src/trading_agent"
match = "(?!test_).*\\.py$"

[tool.bandit]
exclude_dirs = ["tests", "scripts", "research", "frontend"]
skips = ["B101", "B601"]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportGeneralTypeIssues = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInvalidTypeForm = true
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true
reportWildcardImportFromLibrary = true
reportImportCycles = true
reportShadowedImports = true
reportPrivateUsage = false
reportConstantRedefinition = true
reportDeprecated = true
reportNewerVersionAvailable = false
pythonVersion = "3.11"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.sql", "*.txt"]

[tool.alembic]
script_location = "migrations"
version_path_separator = "os"
file_template = "%%Y%%m%%d_%%H%%M%%S_%%(rev)s_%%(slug)s"